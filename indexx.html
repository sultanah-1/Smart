<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفي الذكي - Smart Shelf 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #eae6df;
            color: #1e2e28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            text-align: center;
            margin-bottom: 2px;
        }
        header h1 {
            color: #1e2e28;
            font-size: 1.6rem;
            margin-bottom: 2px;
        }
        header p {
            color: #4a5d54;
            font-size: 0.95rem;
            font-weight: bold;
        }
        #canvas-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            background: linear-gradient(135deg, #f5f3ef 0%, #ded9d0 100%);
            margin: 5px 0;
        }
        .instructions {
            background: #1e2e28;
            color: #eae6df;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>نظام الرف الذكي (Smart Shelf)</h1>
        <p>استكشف الرف الذكي بتصميم ثلاثي الأبعاد لفيها من كل الجهات</p>
    </header>

    <div id="canvas-container"></div>

    <div class="instructions">
        💡 انقر فوراً على أي منتج لإزالته/إرجاعه، واسحب من اللوحة الجانبية لتدوير الرف من كل الجهات!
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 7.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(4, 8, 6);
        scene.add(dirLight);

        const shelfGroup = new THREE.Group();
        scene.add(shelfGroup);

        const frameMat = new THREE.MeshStandardMaterial({ color: 0x737a82, roughness: 0.35, metalness: 0.65 }); 
        const backMat = new THREE.MeshStandardMaterial({ color: 0x1c2723, roughness: 0.7 }); 
        const shelfMat = new THREE.MeshStandardMaterial({ color: 0x424a52, roughness: 0.4, metalness: 0.3 }); 
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x151d1a, roughness: 0.3 }); 
        const capMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.8, roughness: 0.3 });

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(3.3, 3.4, 0.1), backMat);
        backWall.position.set(0, 0, -0.6);
        shelfGroup.add(backWall);

        const sideGeo = new THREE.BoxGeometry(0.15, 3.4, 1.2);
        const leftSide = new THREE.Mesh(sideGeo, frameMat); leftSide.position.set(-1.7, 0, 0); shelfGroup.add(leftSide);
        const rightSide = new THREE.Mesh(sideGeo, frameMat); rightSide.position.set(1.7, 0, 0); shelfGroup.add(rightSide);

        const topBottomGeo = new THREE.BoxGeometry(3.55, 0.15, 1.2);
        const topBoard = new THREE.Mesh(topBottomGeo, frameMat); topBoard.position.set(0, 1.7, 0); shelfGroup.add(topBoard);
        const bottomBoard = new THREE.Mesh(topBottomGeo, frameMat); bottomBoard.position.set(0, -1.7, 0); shelfGroup.add(bottomBoard);

        const shelfBoardGeo = new THREE.BoxGeometry(3.25, 0.08, 1.15);
        const loadCellGeo = new THREE.BoxGeometry(0.35, 0.03, 0.18);
        const loadCellMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85 });

        const shelfHeights = [0.95, 0.0, -0.95];
        shelfHeights.forEach(y => {
            const sBoard = new THREE.Mesh(shelfBoardGeo, shelfMat);
            sBoard.position.set(0, y, 0);
            shelfGroup.add(sBoard);
            [-1.2, 1.2].forEach(x => {
                [-0.4, 0.4].forEach(z => {
                    const cell = new THREE.Mesh(loadCellGeo, loadCellMat);
                    cell.position.set(x, y - 0.055, z);
                    shelfGroup.add(cell);
                });
            });
        });

        // لوحة التحكم والشاشات
        const controlPanel = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.6, 1.1), panelMat);
        controlPanel.position.set(2.05, 0, 0.05);
        shelfGroup.add(controlPanel);

        // شاشة الوزن
        const canvasLCD = document.createElement('canvas');
        canvasLCD.width = 128; canvasLCD.height = 64;
        const ctx = canvasLCD.getContext('2d');
        function updateLCD(weightVal) {
            ctx.fillStyle = '#0a1410'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
            ctx.fillText("WEIGHT", 64, 20);
            ctx.font = 'bold 20px monospace'; ctx.fillText(weightVal.toFixed(1) + " kg", 64, 48);
        }
        const lcdTexture = new THREE.CanvasTexture(canvasLCD);
        const lcdFace = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, 0.01), new THREE.MeshBasicMaterial({ map: lcdTexture }));
        lcdFace.position.set(2.05, 0.95, 0.62);
        shelfGroup.add(lcdFace);

        // شاشة الرمز التسلسلي SH-4821
        const canvasSN = document.createElement('canvas');
        canvasSN.width = 128; canvasSN.height = 64;
        const ctxSN = canvasSN.getContext('2d');
        ctxSN.fillStyle = '#0a1410'; ctxSN.fillRect(0, 0, 128, 64);
        ctxSN.fillStyle = '#38bdf8'; ctxSN.font = 'bold 14px monospace'; ctxSN.textAlign = 'center';
        ctxSN.fillText("SERIAL ID", 64, 20);
        ctxSN.fillStyle = '#f59e0b'; ctxSN.font = 'bold 15px monospace';
        ctxSN.fillText("SH-4821", 64, 48);
        const snFace = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, 0.01), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasSN) }));
        snFace.position.set(2.05, 0.45, 0.62);
        shelfGroup.add(snFace);

        // شاشة الحالة
        const canvasSet = document.createElement('canvas');
        canvasSet.width = 128; canvasSet.height = 64;
        const ctxSet = canvasSet.getContext('2d');
        ctxSet.fillStyle = '#0a1410'; ctxSet.fillRect(0, 0, 128, 64);
        ctxSet.fillStyle = '#a855f7'; ctxSet.font = 'bold 14px monospace'; ctxSet.textAlign = 'center';
        ctxSet.fillText("STATUS", 64, 20);
        ctxSet.fillStyle = '#22c55e'; ctxSet.font = 'bold 13px monospace';
        ctxSet.fillText("ONLINE", 64, 48);
        const setFace = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, 0.01), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasSet) }));
        setFace.position.set(2.05, -0.05, 0.62);
        shelfGroup.add(setFace);

        const ledGreen = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
        const ledRed = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
        const led1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), ledGreen); led1.position.set(2.05, -0.65, 0.61); shelfGroup.add(led1);
        const led2 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), ledRed); led2.position.set(2.05, -0.85, 0.61); shelfGroup.add(led2);

        const products = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // إنشاء المنتجات
        const jarGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.48, 20);
        const jarCapGeo = new THREE.CylinderGeometry(0.19, 0.19, 0.08, 20);
        const spices = [
            { color: 0x8b5a2b, x: -1.05, weight: 1.2 },
            { color: 0xb22222, x: -0.35, weight: 1.0 },
            { color: 0xf5f5f5, x: 0.35, weight: 1.5 },
            { color: 0xffffff, x: 1.05, weight: 1.3 }
        ];

        spices.forEach(item => {
            const group = new THREE.Group();
            const jar = new THREE.Mesh(jarGeo, new THREE.MeshPhysicalMaterial({ color: item.color, transmission: 0.4, opacity: 0.9, transparent: true, roughness: 0.2 }));
            jar.position.set(0, 0.27, 0);
            const cap = new THREE.Mesh(jarCapGeo, capMat);
            cap.position.set(0, 0.53, 0);
            group.add(jar); group.add(cap);
            group.position.set(item.x, 0.95, 0.05);
            shelfGroup.add(group);
            products.push({ mesh: group, weight: item.weight, present: true });
        });

        const serumMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const serumBody = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.35, 16), serumMat); serumBody.position.set(0, 0.2, 0);
        const serumCap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0x222222 })); serumCap.position.set(0, 0.42, 0);
        const p1 = new THREE.Group(); p1.add(serumBody); p1.add(serumCap); p1.position.set(-1.05, 0.0, 0.05); shelfGroup.add(p1);
        products.push({ mesh: p1, weight: 0.4, present: true });

        const tonerMat = new THREE.MeshPhysicalMaterial({ color: 0xffe4e1, transmission: 0.7, transparent: true, roughness: 0.1 });
        const tonerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.45, 16), tonerMat); tonerBody.position.set(0, 0.25, 0);
        const tonerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.1, 16), capMat); tonerCap.position.set(0, 0.52, 0);
        const p2 = new THREE.Group(); p2.add(tonerBody); p2.add(tonerCap); p2.position.set(-0.35, 0.0, 0.05); shelfGroup.add(p2);
        products.push({ mesh: p2, weight: 0.8, present: true });

        const powder = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 24), new THREE.MeshStandardMaterial({ color: 0x111111 })); powder.position.set(0.35, 0.11, 0.05);
        const p3 = new THREE.Group(); p3.add(powder); shelfGroup.add(p3);
        products.push({ mesh: p3, weight: 0.5, present: true });

        const lipBase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.25, 16), capMat); lipBase.position.set(0, 0.15, 0);
        const lipRed = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.15, 16), new THREE.MeshStandardMaterial({ color: 0xb22222 })); lipRed.position.set(0, 0.3, 0);
        const p4 = new THREE.Group(); p4.add(lipBase); p4.add(lipRed); p4.position.set(1.05, 0.0, 0.05); shelfGroup.add(p4);
        products.push({ mesh: p4, weight: 0.2, present: true });

        const bottleShape = new THREE.CylinderGeometry(0.2, 0.24, 0.55, 20);
        const shampoo = new THREE.Mesh(bottleShape, new THREE.MeshStandardMaterial({ color: 0xfaf9f6 })); shampoo.position.set(0, 0.31, 0);
        const sCap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0x5c4033 })); sCap.position.set(0, 0.62, 0);
        const p5 = new THREE.Group(); p5.add(shampoo); p5.add(sCap); p5.position.set(-0.5, -0.95, 0.05); shelfGroup.add(p5);
        products.push({ mesh: p5, weight: 1.8, present: true });

        const conditioner = new THREE.Mesh(bottleShape, new THREE.MeshStandardMaterial({ color: 0xffedd8 })); conditioner.position.set(0, 0.31, 0);
        const cCap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.1, 16), capMat); cCap.position.set(0, 0.62, 0);
        const p6 = new THREE.Group(); p6.add(conditioner); p6.add(cCap); p6.position.set(0.5, -0.95, 0.05); shelfGroup.add(p6);
        products.push({ mesh: p6, weight: 1.8, present: true });

        function calculateTotalWeight() {
            let total = 0;
            products.forEach(p => { if (p.present) total += p.weight; });
            return total;
        }
        updateLCD(calculateTotalWeight());
        lcdTexture.needsUpdate = true;

        // تفاعل النقرة الفورية السريعة على المنتجات
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(shelfGroup.children, true);
            if (intersects.length > 0) {
                let clickedObj = intersects[0].object;
                products.forEach(p => {
                    if (p.mesh.children.includes(clickedObj) || p.mesh === clickedObj) {
                        p.present = !p.present;
                        p.mesh.visible = p.present;
                        updateLCD(calculateTotalWeight());
                        lcdTexture.needsUpdate = true;
                    }
                });
            }
        });

        // تدوير الرف بسلاسة عند السحب من اللوحة الجانبية أو الفراغ
        let isDragging = false;
        let prevPos = { x: 0, y: 0 };
        let autoRotate = true;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            autoRotate = false;
            prevPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - prevPos.x;
            const deltaY = e.clientY - prevPos.y;

            shelfGroup.rotation.y += deltaX * 0.008;
            shelfGroup.rotation.x += deltaY * 0.008;
            shelfGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, shelfGroup.rotation.x));

            prevPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // دعم السحب باللمس للآيباد والجوال
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                autoRotate = false;
                prevPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - prevPos.x;
            const deltaY = e.touches[0].clientY - prevPos.y;

            shelfGroup.rotation.y += deltaX * 0.008;
            shelfGroup.rotation.x += deltaY * 0.008;
            shelfGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, shelfGroup.rotation.x));

            prevPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) shelfGroup.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
