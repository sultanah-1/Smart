<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفي الذكي - Smart Shelf 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #eae6df;
            color: #1e2e28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            text-align: center;
            margin-bottom: 2px;
        }
        header h1 {
            color: #1e2e28;
            font-size: 1.6rem;
            margin-bottom: 2px;
        }
        header p {
            color: #4a5d54;
            font-size: 0.95rem;
            font-weight: bold;
        }
        #canvas-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            background: linear-gradient(135deg, #f5f3ef 0%, #ded9d0 100%);
            margin: 5px 0;
        }
        .instructions {
            background: #1e2e28;
            color: #eae6df;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>نظام الرف الذكي (Smart Shelf)</h1>
        <p>استكشف الرف الذكي بتصميم ثلاثي الأبعاد لفيها من كل الجهات</p>
    </header>

    <div id="canvas-container"></div>

    <div class="instructions">
        💡 اسحب بإصبعك أو الفأرة لتدوير الرف واستعراضه من جميع الجهات
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 7.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // الإضاءة العامة والمركزة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(4, 8, 6);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffe6cc, 0.4, 10);
        pointLight.position.set(-2, 1, 3);
        scene.add(pointLight);

        const shelfGroup = new THREE.Group();
        scene.add(shelfGroup);

        // الألوان والخامات المعتمدة (رمادي معدني، زيت أصلي غامق)
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x737a82, roughness: 0.35, metalness: 0.65 }); 
        const backMat = new THREE.MeshStandardMaterial({ color: 0x1c2723, roughness: 0.7 }); 
        const shelfMat = new THREE.MeshStandardMaterial({ color: 0x424a52, roughness: 0.4, metalness: 0.3 }); 
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x151d1a, roughness: 0.3 }); 

        // 1. الجدار الخلفي للرف
        const backGeo = new THREE.BoxGeometry(3.3, 3.4, 0.1);
        const backWall = new THREE.Mesh(backGeo, backMat);
        backWall.position.set(0, 0, -0.6);
        shelfGroup.add(backWall);

        // 2. الهيكل الخارجي
        const sideGeo = new THREE.BoxGeometry(0.15, 3.4, 1.2);
        const leftSide = new THREE.Mesh(sideGeo, frameMat);
        leftSide.position.set(-1.7, 0, 0);
        shelfGroup.add(leftSide);

        const rightSide = new THREE.Mesh(sideGeo, frameMat);
        rightSide.position.set(1.7, 0, 0);
        shelfGroup.add(rightSide);

        const topBottomGeo = new THREE.BoxGeometry(3.55, 0.15, 1.2);
        const topBoard = new THREE.Mesh(topBottomGeo, frameMat);
        topBoard.position.set(0, 1.7, 0);
        shelfGroup.add(topBoard);

        const bottomBoard = new THREE.Mesh(topBottomGeo, frameMat);
        bottomBoard.position.set(0, -1.7, 0);
        shelfGroup.add(bottomBoard);

        // 3. الأرفف وحساسات الوزن
        const shelfBoardGeo = new THREE.BoxGeometry(3.25, 0.08, 1.15);
        const loadCellGeo = new THREE.BoxGeometry(0.35, 0.03, 0.18);
        const loadCellMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85 });

        const shelfHeights = [0.95, 0.0, -0.95];
        shelfHeights.forEach(y => {
            const sBoard = new THREE.Mesh(shelfBoardGeo, shelfMat);
            sBoard.position.set(0, y, 0);
            shelfGroup.add(sBoard);

            [-1.2, 1.2].forEach(x => {
                [-0.4, 0.4].forEach(z => {
                    const cell = new THREE.Mesh(loadCellGeo, loadCellMat);
                    cell.position.set(x, y - 0.055, z);
                    shelfGroup.add(cell);
                });
            });
        });

        // 4. لوحة التحكم الجانبية والشاشات
        const panelGeo = new THREE.BoxGeometry(0.5, 2.6, 1.1);
        const controlPanel = new THREE.Mesh(panelGeo, panelMat);
        controlPanel.position.set(2.05, 0, 0.05);
        shelfGroup.add(controlPanel);

        // شاشة الوزن
        const canvasLCD = document.createElement('canvas');
        canvasLCD.width = 128; canvasLCD.height = 64;
        const ctx = canvasLCD.getContext('2d');
        function updateLCD(weightVal) {
            ctx.fillStyle = '#0a1410'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
            ctx.fillText("WEIGHT", 64, 22);
            ctx.font = 'bold 22px monospace'; ctx.fillText(weightVal + " kg", 64, 52);
        }
        updateLCD("15.2");
        const lcdTexture = new THREE.CanvasTexture(canvasLCD);
        const lcdFace = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.01), new THREE.MeshBasicMaterial({ map: lcdTexture }));
        lcdFace.position.set(2.05, 0.9, 0.62);
        shelfGroup.add(lcdFace);

        // شاشة الإعدادات
        const canvasSet = document.createElement('canvas');
        canvasSet.width = 128; canvasSet.height = 64;
        const ctxSet = canvasSet.getContext('2d');
        ctxSet.fillStyle = '#0a1410'; ctxSet.fillRect(0, 0, 128, 64);
        ctxSet.fillStyle = '#38bdf8'; ctxSet.font = 'bold 16px monospace'; ctxSet.textAlign = 'center';
        ctxSet.fillText("SETTINGS", 64, 22);
        ctxSet.fillStyle = '#22c55e'; ctxSet.font = 'bold 13px monospace';
        ctxSet.fillText("SYS: ACTIVE", 64, 48);
        const setTexture = new THREE.CanvasTexture(canvasSet);
        const setFace = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.01), new THREE.MeshBasicMaterial({ map: setTexture }));
        setFace.position.set(2.05, 0.3, 0.62);
        shelfGroup.add(setFace);

        // الأزرار وLED
        const btnMat = new THREE.MeshStandardMaterial({ color: 0x9ba3af, metalness: 0.6 });
        const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 16), btnMat);
        btn.rotation.x = Math.PI / 2; btn.position.set(2.05, -0.3, 0.61);
        shelfGroup.add(btn);

        const ledGreen = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
        const ledRed = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
        const led1 = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), ledGreen);
        led1.position.set(2.05, -0.68, 0.61); shelfGroup.add(led1);
        const led2 = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), ledRed);
        led2.position.set(2.05, -0.9, 0.61); shelfGroup.add(led2);

        // 5. بناء المنتجات المطابقة للصورة تماماً

        // --- الرف العلوي: 4 برطمانات بهارات زجاجية (كمون، بابريكا، دقيق، سكر) ---
        const jarGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.48, 20);
        const jarCapGeo = new THREE.CylinderGeometry(0.19, 0.19, 0.08, 20);
        const capMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, metalness: 0.8, roughness: 0.3 }); // غطاء ذهبي

        const spices = [
            { color: 0x8b5a2b, x: -1.05 }, // كمون
            { color: 0xb22222, x: -0.35 }, // بابريكا
            { color: 0xf5f5f5, x: 0.35 },  // دقيق
            { color: 0xffffff, x: 1.05 }   // سكر
        ];

        spices.forEach(item => {
            const glassMat = new THREE.MeshPhysicalMaterial({ color: item.color, transmission: 0.4, opacity: 0.9, transparent: true, roughness: 0.2 });
            const jar = new THREE.Mesh(jarGeo, glassMat);
            jar.position.set(item.x, 0.95 + 0.27, 0.05);
            
            const cap = new THREE.Mesh(jarCapGeo, capMat);
            cap.position.set(item.x, 0.95 + 0.53, 0.05);
            
            shelfGroup.add(jar);
            shelfGroup.add(cap);
        });

        // --- الرف الأوسط: منتجات العناية (سيروم، تونر، بودرة، أحمر شفاه) ---
        // 1. سيروم بقطارة
        const serumMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const serumBody = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.35, 16), serumMat);
        serumBody.position.set(-1.05, 0.0 + 0.2, 0.05);
        const serumCap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        serumCap.position.set(-1.05, 0.0 + 0.42, 0.05);
        shelfGroup.add(serumBody); shelfGroup.add(serumCap);

        // 2. تونر ماء الورد
        const tonerMat = new THREE.MeshPhysicalMaterial({ color: 0xffe4e1, transmission: 0.7, transparent: true, roughness: 0.1 });
        const tonerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.45, 16), tonerMat);
        tonerBody.position.set(-0.35, 0.0 + 0.25, 0.05);
        const tonerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.1, 16), capMat);
        tonerCap.position.set(-0.35, 0.0 + 0.52, 0.05);
        shelfGroup.add(tonerBody); shelfGroup.add(tonerCap);

        // 3. بودرة وجه دائرية
        const powderMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const powder = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 24), powderMat);
        powder.position.set(0.35, 0.0 + 0.11, 0.05);
        shelfGroup.add(powder);

        // 4. أحمر شفاه (روج)
        const lipstickBase = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.25, 16), capMat);
        lipstickBase.position.set(1.05, 0.0 + 0.15, 0.05);
        const lipstickRed = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.15, 16), new THREE.MeshStandardMaterial({ color: 0xb22222 }));
        lipstickRed.position.set(1.05, 0.0 + 0.3, 0.05);
        shelfGroup.add(lipstickBase); shelfGroup.add(lipstickRed);

        // --- الرف السفلي: عبوات شامبو وبلسم منحنية أنيقة ---
        const bottleShape = new THREE.CylinderGeometry(0.2, 0.24, 0.55, 20);
        
        // شامبو
        const shampooMat = new THREE.MeshStandardMaterial({ color: 0xfaf9f6, roughness: 0.3 });
        const shampoo = new THREE.Mesh(bottleShape, shampooMat);
        shampoo.position.set(-0.5, -0.95 + 0.31, 0.05);
        const shampooCap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
        shampooCap.position.set(-0.5, -0.95 + 0.62, 0.05);
        shelfGroup.add(shampoo); shelfGroup.add(shampooCap);

        // بلسم
        const conditionerMat = new THREE.MeshStandardMaterial({ color: 0xffedd8, roughness: 0.3 });
        const conditioner = new THREE.Mesh(bottleShape, conditionerMat);
        conditioner.position.set(0.5, -0.95 + 0.31, 0.05);
        const conditionerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.1, 16), capMat);
        conditionerCap.position.set(0.5, -0.95 + 0.62, 0.05);
        shelfGroup.add(conditioner); shelfGroup.add(conditionerCap);

        // تفاعل الماوس واللمس لتدوير الرف
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            shelfGroup.rotation.y += deltaX * 0.008;
            shelfGroup.rotation.x += deltaY * 0.008;
            shelfGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, shelfGroup.rotation.x));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            shelfGroup.rotation.y += deltaX * 0.008;
            shelfGroup.rotation.x += deltaY * 0.008;
            shelfGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, shelfGroup.rotation.x));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        let autoRotate = true;
        container.addEventListener('pointerdown', () => { autoRotate = false; });

        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) {
                shelfGroup.rotation.y += 0.003;
            }
            if (Math.random() < 0.02) {
                let randomWeight = (14.8 + Math.random() * 0.8).toFixed(1);
                updateLCD(randomWeight);
                lcdTexture.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
